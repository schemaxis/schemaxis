<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artifact Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header id="topbar" class="topbar"></header>
  <div id="contextbar" class="contextbar"></div>
  <div id="workspace" class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="Folders, filters and recent collections"></aside>
    <div class="center">
      <main id="main" class="main" tabindex="-1"></main>
      <section id="viewer" class="viewer-layer" hidden></section>
    </div>
    <aside id="inspector" class="inspector" aria-label="File details"></aside>
  </div>
  <footer id="statusbar" class="statusbar"></footer>
</div>
<input type="file" id="file-input" multiple hidden>
<script type="module" src="app.mjs"></script>
</body>
</html>
