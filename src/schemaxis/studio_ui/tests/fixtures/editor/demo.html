<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Schemaxis Studio editor demo</title>
  <link rel="stylesheet" href="../../../styles/tokens.css">
  <link rel="stylesheet" href="../../../styles/base.css">
  <link rel="stylesheet" href="../../../styles/editor.css">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.mjs"></script>
</head>
<body>
  <main class="demo">
    <header class="demo-bar">
      <strong>JSON editor</strong>
      <span id="demo-schema" class="demo-muted">loading schema…</span>
      <span class="demo-spacer"></span>
      <label><input id="demo-suggestions" type="checkbox" checked> Suggestions</label>
      <button id="demo-format" type="button">Format</button>
      <button id="demo-preview" type="button">Preview snippet</button>
      <button id="demo-commit" type="button">Insert</button>
    </header>
    <section id="demo-editor" class="demo-editor"></section>
    <footer id="demo-status" class="demo-bar demo-muted">Ready</footer>
  </main>
</body>
</html>
