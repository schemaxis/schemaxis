<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'">
  <title>Viewer demo</title>
  <link rel="stylesheet" href="../../../styles/tokens.css">
  <link rel="stylesheet" href="../../../styles/viewers.css">
  <link rel="stylesheet" href="demo.css">
  <script type="module" src="demo.mjs"></script>
</head>
<body>
  <header class="demo-bar">
    <strong>Schemaxis Studio · viewer fixtures</strong>
    <span id="demo-status" class="demo-status">Loading…</span>

  <main class="demo-grid">
    <div class="demo-cell" id="slot-3d"></div>

    <div class="demo-cell" id="slot-text"></div>

  <footer class="demo-refs" aria-label="References">
    <span class="demo-refs-label">References</span>
    <span id="demo-chips" class="demo-chips"></span>
  </footer>
