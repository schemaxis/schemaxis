[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaxis"
version = "0.4.0"
description = "Declared, repeatable pipelines across engineering and creative desktop applications, with verified evidence"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "David L. F. Gaden", email = "d.gaden.schemaxis@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "COPYRIGHT", "LICENSES/*"]
keywords = ["workflow", "automation", "ai-agents", "paraview", "freecad", "gmsh",
            "blender", "cfd", "cad", "verification", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.18.6,<0.19"]
test = ["jsonschema"]

[project.urls]
Homepage = "https://schemaxis.io"
Documentation = "https://github.com/schemaxis/schemaxis/tree/main/docs"
Source = "https://github.com/schemaxis/schemaxis"
Issues = "https://github.com/schemaxis/schemaxis/issues"
Changelog = "https://github.com/schemaxis/schemaxis/blob/main/CHANGELOG.md"

[project.scripts]
schemaxis = "schemaxis.__main__:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["schemaxis", "schemaxis.*"]
exclude = ["schemaxis.studio_ui.tests*"]
namespaces = true

[tool.setuptools.package-data]
schemaxis = ["*.json", "*.txt",
             "adaptors/*/studio.json", "adaptors/*/guidance.json", "adaptors/*/studio/templates/*.json",
             "adaptors/*/uxp/*.html", "adaptors/*/uxp/*.js", "adaptors/*/uxp/*.json",
             "studio_ui/help/*.json", "studio_ui/*.html", "studio_ui/**/*.mjs", "studio_ui/**/*.css", "studio_ui/**/*.svg"]
"*" = ["*.json", "*.txt"]
"schemaxis.adaptors.paraview" = ["paraview_extensions/*.json"]
"schemaxis.adaptors.paraview.mvp" = ["package.json", "capabilities/*.json", "native/*.json", "native/*.txt", "native/*.md"]
"schemaxis.adaptors.fixture_geo" = ["package.json", "capabilities/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["studio_ui/tests/*", "studio_ui/tests/**/*", "tests/*", "tests/**/*"]
