name: Tests, generated reference and release gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema
      - run: PYTHONPATH=src python -m schemaxis reference --check
      - run: PYTHONPATH=src python tools/generate_studio_help.py --check
      - run: PYTHONPATH=src python -m unittest discover -s tests/unit -q
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Studio module tests (no browser)
        run: |
          node --test $(ls src/schemaxis/studio_ui/tests/*.test.mjs | grep -v browser)
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/release_gate.py --path dist
